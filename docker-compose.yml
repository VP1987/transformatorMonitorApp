services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "${DB_PORT:-1433}:1433"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DB_CONNECTION_STRING=Server=db;Database=TransformerTestDataBase;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True
      - ASPNETCORE_ENVIRONMENT=Development
      - BACKEND_PORT=${BACKEND_PORT:-61471}
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
      - BACKEND_URL=http://localhost:${BACKEND_PORT:-61471}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-5173}
      - ASPNETCORE_URLS=http://+:${BACKEND_PORT:-61471}
    ports:
      - "${BACKEND_PORT:-61471}:${BACKEND_PORT:-61471}"
    depends_on:
      - db

  ui:
    build:
      context: .
      dockerfile: presentation/Dockerfile
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-61471}
      - FRONTEND_PORT=${FRONTEND_PORT:-5173}
      - BACKEND_URL=http://localhost:${BACKEND_PORT:-61471}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
